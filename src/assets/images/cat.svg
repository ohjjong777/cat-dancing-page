<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <!-- Body -->
  <ellipse cx="100" cy="190" rx="60" ry="70" fill="#F4A460" />

  <!-- Head -->
  <circle cx="100" cy="100" r="55" fill="#F4A460" />

  <!-- Left Ear -->
  <polygon points="52,55 35,15 75,45" fill="#F4A460" />
  <polygon points="55,52 42,22 70,45" fill="#FFB6C1" />

  <!-- Right Ear -->
  <polygon points="148,55 165,15 125,45" fill="#F4A460" />
  <polygon points="145,52 158,22 130,45" fill="#FFB6C1" />

  <!-- Face markings -->
  <ellipse cx="100" cy="110" rx="30" ry="25" fill="#FFDAB9" />

  <!-- Eyes -->
  <ellipse cx="82" cy="92" rx="10" ry="12" fill="#333" />
  <ellipse cx="118" cy="92" rx="10" ry="12" fill="#333" />
  <!-- Eye shine -->
  <circle cx="85" cy="88" r="3" fill="white" />
  <circle cx="121" cy="88" r="3" fill="white" />
  <!-- Pupils -->
  <ellipse cx="83" cy="93" rx="5" ry="7" fill="#111" />
  <ellipse cx="119" cy="93" rx="5" ry="7" fill="#111" />

  <!-- Nose -->
  <polygon points="100,108 95,115 105,115" fill="#FF6B8A" />

  <!-- Mouth -->
  <path d="M 95 116 Q 100 122 105 116" stroke="#333" stroke-width="1.5" fill="none" />

  <!-- Whiskers left -->
  <line x1="70" y1="112" x2="30" y2="108" stroke="#666" stroke-width="1.5" />
  <line x1="70" y1="117" x2="28" y2="118" stroke="#666" stroke-width="1.5" />
  <line x1="70" y1="122" x2="32" y2="128" stroke="#666" stroke-width="1.5" />

  <!-- Whiskers right -->
  <line x1="130" y1="112" x2="170" y2="108" stroke="#666" stroke-width="1.5" />
  <line x1="130" y1="117" x2="172" y2="118" stroke="#666" stroke-width="1.5" />
  <line x1="130" y1="122" x2="168" y2="128" stroke="#666" stroke-width="1.5" />

  <!-- Left arm (raised) -->
  <ellipse cx="35" cy="175" rx="16" ry="40" fill="#F4A460" transform="rotate(-30, 35, 175)" />
  <!-- Right arm (raised other side) -->
  <ellipse cx="165" cy="175" rx="16" ry="40" fill="#F4A460" transform="rotate(30, 165, 175)" />

  <!-- Left paw -->
  <circle cx="22" cy="150" r="12" fill="#F4A460" />
  <circle cx="14" cy="143" r="5" fill="#FFDAB9" />
  <circle cx="22" cy="140" r="5" fill="#FFDAB9" />
  <circle cx="30" cy="143" r="5" fill="#FFDAB9" />

  <!-- Right paw -->
  <circle cx="178" cy="150" r="12" fill="#F4A460" />
  <circle cx="170" cy="143" r="5" fill="#FFDAB9" />
  <circle cx="178" cy="140" r="5" fill="#FFDAB9" />
  <circle cx="186" cy="143" r="5" fill="#FFDAB9" />

  <!-- Legs -->
  <ellipse cx="78" cy="255" rx="18" ry="28" fill="#F4A460" />
  <ellipse cx="122" cy="255" rx="18" ry="28" fill="#F4A460" />

  <!-- Feet -->
  <ellipse cx="72" cy="275" rx="22" ry="10" fill="#F4A460" />
  <ellipse cx="128" cy="275" rx="22" ry="10" fill="#F4A460" />

  <!-- Tail -->
  <path d="M 155 240 Q 200 210 185 170 Q 175 145 190 130" stroke="#F4A460" stroke-width="14" fill="none" stroke-linecap="round" />
  <path d="M 155 240 Q 200 210 185 170 Q 175 145 190 130" stroke="#CD853F" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="4,8" />

  <!-- Belly pattern -->
  <ellipse cx="100" cy="200" rx="30" ry="35" fill="#FFDAB9" opacity="0.6" />

  <!-- Blush cheeks -->
  <ellipse cx="68" cy="110" rx="10" ry="6" fill="#FFB6C1" opacity="0.5" />
  <ellipse cx="132" cy="110" rx="10" ry="6" fill="#FFB6C1" opacity="0.5" />

  <!-- Music notes decoration -->
  <text x="5" y="50" font-size="18" fill="#FFD700" opacity="0.8">♪</text>
  <text x="170" y="40" font-size="22" fill="#FF69B4" opacity="0.8">♫</text>
  <text x="15" y="80" font-size="14" fill="#87CEEB" opacity="0.7">♩</text>
  <text x="165" y="75" font-size="16" fill="#98FB98" opacity="0.7">♬</text>
</svg>
